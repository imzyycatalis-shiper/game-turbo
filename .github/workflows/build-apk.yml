name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project from zip
        run: |
          mkdir -p extracted
          for z in ./*.zip; do unzip -o -q "$z" -d extracted; done
          PROJ=$(dirname "$(find extracted -name settings.gradle | head -1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GameTurbo-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
